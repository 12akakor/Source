# ThinkPad X270 test builds for this fork (not for upstream).
#
# Every push to the x270 branch or a test/ branch builds an x86_64 USB image (.img) with the
# same layout as the tablet's hybrid-usb.img, which is known to boot on the
# X270: an MBR with
#   partition 1  EFI system partition (FAT, type 0xef) holding
#                EFI/BOOT/BOOTX64.EFI and a 512 KiB SYSLOG.TXT
#   partition 2  the Haiku BFS system volume from @nightly-raw (type 0xeb)
# The test kernel writes its syslog into SYSLOG.TXT every 10 seconds (see
# vfs_boot.cpp), so the log can be read on another computer.
#
# Write the .img to a stick in dd mode (Rufus: "DD image").
#
# Runs on GitHub-hosted runners only and has no secrets.
name: x270-build

on:
  workflow_dispatch:
  push:
    branches: [x270, 'test/**']

permissions:
  contents: read

concurrency:
  group: x270-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      name: ${{ steps.img.outputs.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve toolchain image
        id: toolchain
        run: |
          set -euo pipefail
          if [ -f .github/toolchain.pin ]; then
            # shellcheck disable=SC1091
            . .github/toolchain.pin
          fi
          REV="${BUILDTOOLS_REV:-master}"
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/cross-compiler:x86_64-${REV}" >> "$GITHUB_OUTPUT"

      - name: Pull toolchain
        run: docker pull --quiet "${{ steps.toolchain.outputs.image }}"

      - name: Cache dependency packages
        uses: actions/cache@v4
        with:
          path: generated.x86_64/download
          key: hpkg-x86_64-${{ hashFiles('build/jam/repositories/HaikuPorts/x86_64') }}
          restore-keys: |
            hpkg-x86_64-

      - name: Brand the build
        id: brand
        run: |
          set -euo pipefail
          # A fork does not carry upstream's hrev tags, and the revision is
          # derived from them. Fetch them from the organisation repository.
          if ! git describe --tags --match='hrev*' >/dev/null 2>&1; then
            git fetch --quiet --no-recurse-submodules \
              https://github.com/RenkuOS/Source.git \
              'refs/tags/hrev*:refs/tags/hrev*'
          fi
          REV="$(git describe --dirty --tags --match='hrev*' --abbrev=1 \
                 | sed 's/-g[0-9a-z]\+//' | sed 's/-/+/g')"
          if [ -z "${REV}" ]; then
            echo "::error::no hrev tag reachable; checkout is missing tags"
            exit 1
          fi
          BUILD="x270$(printf '%05d' "${{ github.run_number }}")"
          cat > build/jam/UserBuildConfig <<EOF
          HAIKU_IMAGE_LABEL = "RenkuOS" ;
          HAIKU_REVISION = "${REV}" ;
          RENKUOS_BUILD = "${BUILD}" ;
          EOF
          # Test programs a test/ branch lists (one jam target per line) go
          # into /boot/home/tests, so they can be run on the machine itself.
          if [ -s .github/x270-test-programs ]; then
            TESTS="$(grep -v '^#' .github/x270-test-programs | tr '\n' ' ')"
            echo "AddFilesToHaikuImage home tests : ${TESTS} ;" \
              >> build/jam/UserBuildConfig
          fi
          echo "HAIKU_REVISION=${REV}" >> "$GITHUB_ENV"
          echo "HAIKU_IMAGE_LABEL=RenkuOS" >> "$GITHUB_ENV"
          echo "RENKUOS_BUILD=${BUILD}" >> "$GITHUB_ENV"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "Build ${BUILD}, revision ${REV}"

      - name: Configure and build
        env:
          IMAGE: ${{ steps.toolchain.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/src" -w /src \
            -e HOME=/tmp -e TERM=dumb \
            -e HAIKU_REVISION -e HAIKU_IMAGE_LABEL -e RENKUOS_BUILD \
            "${IMAGE}" \
            bash -euo pipefail -c '
              git config --global --add safe.directory /src
              printf "tries = 10\nwaitretry = 5\ntimeout = 60\nretry_connrefused = on\n" > /tmp/.wgetrc
              mkdir -p generated.x86_64
              cd generated.x86_64
              ../configure --distro-compatibility default \
                --cross-tools-prefix /tools/cross-tools-x86_64/bin/x86_64-unknown-haiku-
              jam -q -j"$(nproc)" @nightly-raw
              jam -q -j"$(nproc)" haiku_loader.efi
            '

      - name: Restore ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" . || true

      - name: Assemble the USB image
        id: img
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mtools dosfstools fdisk
          GEN=generated.x86_64
          SYS="$(find "${GEN}" -maxdepth 1 -name '*.image' | head -1)"
          LOADER="$(find "${GEN}" -name haiku_loader.efi | head -1)"
          if [ -z "${SYS}" ] || [ -z "${LOADER}" ]; then
            echo "::error::raw image or haiku_loader.efi missing"; ls -la "${GEN}"; exit 1
          fi

          # The EFI system partition: 32 MiB FAT16.
          rm -f esp.img
          mkfs.fat -F 16 -n RENKUOS-ESP -C esp.img $(( 32 * 1024 ))
          mmd -i esp.img ::EFI ::EFI/BOOT
          mcopy -i esp.img "${LOADER}" ::EFI/BOOT/BOOTX64.EFI
          # Test only: the kernel finds this file by its first line and
          # overwrites it with the syslog every 10 seconds.
          { printf 'RENKUOS-SYSLOG-AREA-v1\n(not written yet)\n'
            head -c $(( 512 * 1024 - 41 )) /dev/zero | tr '\0' ' '; } > SYSLOG.TXT
          mcopy -i esp.img SYSLOG.TXT ::SYSLOG.TXT

          ALIGN=2048   # 1 MiB in 512 byte sectors
          ESP_SECT=$(( $(stat -c %s esp.img) / 512 ))
          SYS_SECT=$(( ($(stat -c %s "${SYS}") + 511) / 512 ))
          START1=${ALIGN}
          START2=$(( (START1 + ESP_SECT + ALIGN - 1) / ALIGN * ALIGN ))
          TOTAL=$(( START2 + SYS_SECT + ALIGN ))

          NAME="RenkuOS-x86_64-$(date -u +%Y%m%d)-${{ steps.brand.outputs.build }}.img"
          mkdir -p out
          truncate -s $(( TOTAL * 512 )) "out/${NAME}"
          sfdisk --quiet "out/${NAME}" <<EOF
          label: dos
          start=${START1}, size=${ESP_SECT}, type=ef, bootable
          start=${START2}, size=${SYS_SECT}, type=eb
          EOF
          dd if=esp.img of="out/${NAME}" bs=512 seek=${START1} conv=notrunc status=none
          dd if="${SYS}" of="out/${NAME}" bs=512 seek=${START2} conv=notrunc status=none

          {
            echo "### ${NAME}"
            echo '```'
            sfdisk -l "out/${NAME}"
            echo
            mdir -/ -i "out/${NAME}@@$(( START1 * 512 ))" ::
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: renku-x86_64-x270-build${{ github.run_number }}
          path: out/*.img
          retention-days: 7

  # Boots the .img itself with 64-bit UEFI firmware, as the X270 does, and
  # reads SYSLOG.TXT back from it afterwards: that tests the loader, the
  # kernel and the syslog writer together.
  boot:
    name: boot x86_64 UEFI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: renku-x86_64-x270-build${{ github.run_number }}

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf mtools
          dpkg -L ovmf > ovmf-files.txt

      - name: Boot and check SYSLOG.TXT
        run: |
          set -uo pipefail
          IMG="$(find . -maxdepth 2 -name 'RenkuOS-*.img' | head -1)"
          CODE="$(grep -E 'OVMF_CODE(_4M)?\.fd$' ovmf-files.txt | head -1)"
          VARS="$(grep -E 'OVMF_VARS(_4M)?\.fd$' ovmf-files.txt | head -1)"
          if [ -z "${IMG}" ] || [ -z "${CODE}" ] || [ -z "${VARS}" ]; then
            echo "::error::image or firmware missing"; cat ovmf-files.txt; exit 1
          fi
          cp "${VARS}" vars.fd
          cp "${IMG}" boot.img
          : > serial.log
          qemu-system-x86_64 \
            -machine q35 -cpu max -smp 2 -accel tcg -m 2048 \
            -drive if=pflash,format=raw,readonly=on,file="${CODE}" \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=boot.img,format=raw,if=ide \
            -display none -serial file:serial.log -no-reboot &
          QEMU=$!
          trap "kill ${QEMU} 2>/dev/null || true" EXIT

          fail_re='Kernel Debugging Land|^PANIC:|error starting "'
          elapsed=0
          while ! grep -qF 'Haiku revision:' serial.log 2>/dev/null; do
            if ! kill -0 "${QEMU}" 2>/dev/null || [ "${elapsed}" -ge 300 ]; then
              echo "::error::no kernel banner from the .img under UEFI"
              tail -40 serial.log; exit 1
            fi
            sleep 5; elapsed=$(( elapsed + 5 ))
          done
          echo "Kernel banner after ${elapsed}s"
          sleep 90
          kill "${QEMU}"; wait "${QEMU}" 2>/dev/null
          if grep -qE "${fail_re}" serial.log; then
            echo "::error::guest failed"; grep -nE "${fail_re}" serial.log | head; exit 1
          fi

          OFF=$(( $(sfdisk -d boot.img | awk -F'[=,]' '/start=/{print $2; exit}') * 512 ))
          mcopy -i "boot.img@@${OFF}" ::SYSLOG.TXT syslog-from-image.txt
          head -2 syslog-from-image.txt
          if ! head -2 syslog-from-image.txt | grep -q 'written'; then
            echo "::error::SYSLOG.TXT was not written by the kernel"; exit 1
          fi
          echo "SYSLOG.TXT was written by the kernel."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-x86_64-x270-build${{ github.run_number }}
          path: |
            serial.log
            syslog-from-image.txt
          retention-days: 7
